name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write # push the edge image to ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run build

      # Every push to main refreshes the edge image; releases keep
      # :vX.Y.Z / :latest (see release.yml).
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push the edge image
        if: github.event_name == 'push'
        run: |
          repo="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          docker build -f Dockerfile.release -t "$repo:edge" .
          docker push "$repo:edge"
