name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run build

      # Stable asset names (no version) so /releases/latest/download/ works.
      - name: Package the theme
        run: |
          tar -czf forgejo-departure.tar.gz -C dist css fonts
          sha256sum forgejo-departure.tar.gz > SHA256SUMS.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" forgejo-departure.tar.gz SHA256SUMS.txt --generate-notes --verify-tag

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the theme image
        run: |
          repo="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          docker build -f Dockerfile.release -t "$repo:$GITHUB_REF_NAME" -t "$repo:latest" .
          docker push "$repo:$GITHUB_REF_NAME"
          docker push "$repo:latest"
